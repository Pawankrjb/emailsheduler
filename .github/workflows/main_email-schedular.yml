# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - email-schedular

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_54374A68A1484718BEE4E835A77387DD }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_36981CD316CE4505B72C5DC0B59999A7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C412C2F95549459C831519130D4DB733 }}

      - name: Auto-configure and start Azure Web App
        run: |
          echo "Finding Resource Group for email-schedular..."
          RG=$(az webapp list --query "[?name=='email-schedular'].resourceGroup" -o tsv | head -n 1)
          echo "Found Resource Group: $RG"
          if [ -n "$RG" ]; then
            echo "Setting startup command to 'node server.js'..."
            az webapp config set --name email-schedular --resource-group "$RG" --startup-file "node server.js" || true
            echo "Starting Web App if stopped..."
            az webapp start --name email-schedular --resource-group "$RG" || true
          else
            az webapp config set --name email-schedular --startup-file "node server.js" || true
            az webapp start --name email-schedular || true
          fi

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'email-schedular'
          slot-name: 'Production'
          package: .