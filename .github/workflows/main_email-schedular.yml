name: Build and deploy to Azure Web App - email-schedular

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # ── Step 1: Build React Frontend ──────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install and build frontend
        run: |
          npm ci
          npm run build

      # ── Step 2: Build Express Backend ─────────────────────────────
      - name: Install and build backend
        working-directory: backend
        run: |
          npm ci
          npm run build

      # ── Step 3: Assemble deployment package ───────────────────────
      # Structure deployed to Azure:
      #   dist/              ← built React frontend
      #   backend/dist/      ← compiled Express server
      #   backend/node_modules/
      #   package.json
      - name: Assemble deployment package
        run: |
          mkdir -p deploy/backend

          # Copy built frontend
          cp -r dist deploy/dist

          # Copy backend compiled output + prod deps
          cp -r backend/dist deploy/backend/dist
          cp backend/package.json deploy/backend/package.json
          cp backend/package-lock.json deploy/backend/package-lock.json
          cd deploy/backend && npm ci --omit=dev && cd ../..

          # Copy backend public assets (Bull Board theme)
          if [ -d "backend/public" ]; then cp -r backend/public deploy/backend/public; fi

          # Root package.json so Azure knows it's a Node app
          cp package.json deploy/package.json

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_54374A68A1484718BEE4E835A77387DD }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_36981CD316CE4505B72C5DC0B59999A7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C412C2F95549459C831519130D4DB733 }}

      - name: Set startup command
        run: |
          RG=$(az webapp list --query "[?name=='email-schedular'].resourceGroup" -o tsv | head -n 1)
          az webapp config set \
            --name email-schedular \
            --resource-group "$RG" \
            --startup-file "node backend/dist/server.js"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'email-schedular'
          slot-name: 'Production'
          package: .